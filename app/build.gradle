plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bat.v2'
    compileSdk 34

    defaultConfig {
        applicationId "com.bat.v2"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "0.3"
        // arm64 only keeps the APK small. Add 'armeabi-v7a' for old 32-bit phones.
        ndk { abiFilters 'arm64-v8a' }
    }

    // The key comes from the GitHub secrets (see README). Without the secrets the workflow makes a temporary key.
    signingConfigs {
        release {
            def ks = file("../bat.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'batbatbat'
                keyAlias System.getenv("KEY_ALIAS") ?: 'bat'
                keyPassword System.getenv("KEY_PASSWORD") ?: 'batbatbat'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("../bat.keystore").exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    // tun2socks is started as a process from nativeLibraryDir, so the .so files must be extracted
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation project(':v2ray')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
